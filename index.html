/* ---------- HELPERS ---------- */
function shrink(file, max=1600, q=0.72){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Could not process photo")),"image/jpeg",q);
    };
    img.onerror = ()=>rej(new Error("Could not read that photo"));
    img.src = url;
  });
}
const fmt = t => t ? new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const techOptions = sel => `<option value="">Unassigned</option>` + TECHS.map(t=>`<option ${t===sel?"selected":""}>${t}</option>`).join("");
const isFinished = o => o.job_lines.length > 0 && o.job_lines.every(l=>l.status==="done");

/* time clock helpers */
const entryMs = e => (e.clock_out ? new Date(e.clock_out) : new Date()) - new Date(e.clock_in);
const sumMs = list => (list||[]).reduce((n,e)=>n+Math.max(0,entryMs(e)),0);
const fmtDur = ms => { const m = Math.round(ms/60000); return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"; };
const hours = ms => (ms/3600000).toFixed(2);
const nameOf = em => { const n = String(em||"").split("@")[0]; return n ? n.charAt(0).toUpperCase()+n.slice(1) : "?"; };
const toLocal = iso => { if(!iso) return ""; const d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fromLocal = v => v ? new Date(v).toISOString() : null;
function liveSpan(list, cls="", dec=false){
  const L = list||[], closed = sumMs(L.filter(e=>e.clock_out)), opens = L.filter(e=>!e.clock_out);
  const s = opens.reduce((n,e)=>n+new Date(e.clock_in).getTime(),0);
  const ms = closed + opens.length*Date.now() - s;
  return `<span class="live ${cls}" data-closed="${closed}" data-n="${opens.length}" data-s="${s}" ${dec?'data-dec="1"':""}>${fmtDur(ms)}${dec?" ("+hours(ms)+" h)":""}</span>`;
}
function tickLive(){
  const now = Date.now();
  document.querySelectorAll(".live").forEach(el=>{
    const ms = +el.dataset.closed + (+el.dataset.n)*now - (+el.dataset.s);
    el.textContent = fmtDur(ms) + (el.dataset.dec ? " ("+hours(ms)+" h)" : "");
  });
}
setInterval(tickLive, 30000);

  return `<div class="timebox">
    <div class="timehead"><span>Time on this job: <span class="total">${liveSpan(ents,"",true)}</span></span>
      <button class="btn small clk ${mine?"stop":"go"}" type="button" data-mode="${mine?"out":"in"}" data-eid="${mine?h(mine.id):""}">${mine?"Clock out":"Clock in"}</button></div>
    ${ents.length?`<details><summary>Time entries (${ents.length})</summary><table class="entries">${rows}</table></details>`:""}</div>`;
}
function setChrome(){
  $("#who").textContent = demo ? "Demo mode" : (user ? user.email : "");
  $("#signout").classList.toggle("hidden", !user && !demo);
}
function fail(e){ alert("Something went wrong: " + (e.message || e)); }

/* ---------- VIEWS ---------- */
function showLogin(){
  demo = false; user = null; setChrome();
  $("#app").innerHTML = `
  <form class="login" id="lf">
    <h1>Sign in</h1><p>Use the account the shop gave you.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert"></div>
    <button class="btn" style="width:100%">Sign in</button>
    <p style="margin:16px 0 0;text-align:center"><button type="button" class="btn plain small" id="dm">Look around in demo mode</button></p>
  </form>`;
  $("#lf").onsubmit = async e=>{
    e.preventDefault(); $("#le").textContent="";
    const {data,error} = await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){ $("#le").textContent = "Wrong email or password."; return; }
    user = data.user; api = real; setChrome(); showList();
  };
  $("#dm").onclick = ()=>{ demo = true; api = fake; setChrome(); showList(); };
}

async function showList(){
  $("#app").innerHTML = `
    ${demo?'<div class="banner">Demo mode: sample data only. Nothing here is saved.</div>':''}
    <div id="clockbar"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search customer, vehicle, or WO #" aria-label="Search work orders" value="${h(filters.q)}">
      <select id="ft" aria-label="Filter by tech"><option value="">All techs</option><option value="__none">Unassigned</option>${TECHS.map(t=>`<option ${t===filters.tech?"selected":""}>${t}</option>`).join("")}</select>
      <select id="fs" aria-label="Show"><option value="open" ${filters.show==="open"?"selected":""}>Open</option><option value="finished" ${filters.show==="finished"?"selected":""}>Finished</option><option value="all" ${filters.show==="all"?"selected":""}>All</option></select>
      <button class="btn" id="new">New work order</button>
    </div>
    <div id="newform" class="hidden"></div>
    <div id="list">Loading…</div>`;
  $("#ft").value = filters.tech;
  view = {name:"list"}; refreshClock();
  let rows = [];
  try{ rows = await api.orders(); }catch(e){ $("#list").textContent=""; return fail(e); }
  const draw = ()=>{
    const q = filters.q.toLowerCase();
    const f = rows.filter(o=>{
      if(![o.wo_number,o.customer_name,o.vehicle,o.tech].join(" ").toLowerCase().includes(q)) return false;
      if(filters.tech==="__none" && o.tech) return false;
      if(filters.tech && filters.tech!=="__none" && o.tech!==filters.tech) return false;
      const fin = isFinished(o);
      if(filters.show==="open" && fin) return false;
      if(filters.show==="finished" && !fin) return false;
      return true;
    });
    $("#list").innerHTML = f.length ? f.map(o=>{
      const lines = [...o.job_lines].sort((a,b)=>a.line_no-b.line_no);
      const done = lines.filter(l=>l.status==="done").length;
      const tm = sumMs(lines.flatMap(l=>l.time_entries||[]));
      const chips = lines.filter(l=>!QUIET.includes(l.status)).map(l=>`<span class="chip" data-s="${h(l.status)}">Job ${h(l.line_no)}: ${h(STATUS[l.status])}</span>`).join("");
      return `<button class="wo ${isFinished(o)?"finished":""}" data-id="${h(o.id)}">
        <div class="wo-top"><b>${h(o.customer_name)}</b><span class="techtag ${o.tech?"":"none"}">${o.tech?h(o.tech):"Unassigned"}</span></div>
        <div class="sub">${h(o.vehicle||"No vehicle listed")}${o.wo_number?" · WO "+h(o.wo_number):""}</div>
        ${chips?`<div class="chips">${chips}</div>`:""}
        <div class="progress">${done} of ${lines.length} jobs done${tm?" · "+fmtDur(tm)+" logged":""}</div></button>`;
    }).join("") : `<p>No work orders match. Change the filters or use New work order.</p>`;
  };
  draw();
  $("#q").oninput = e=>{ filters.q = e.target.value; draw(); };
  $("#ft").onchange = e=>{ filters.tech = e.target.value; draw(); };
  $("#fs").onchange = e=>{ filters.show = e.target.value; draw(); };
  $("#list").onclick = e=>{ const b=e.target.closest(".wo"); if(b) showOrder(b.dataset.id); };
  $("#new").onclick = ()=>{
    const f = $("#newform"); f.classList.toggle("hidden");
    if(f.classList.contains("hidden")) return;
    f.innerHTML = `<form class="box" id="nf"><h2>New work order</h2>
      <div class="grid2">
        <div><label>Customer name</label><input name="customer_name" required></div>
        <div><label>Assigned tech</label><select name="tech">${techOptions("")}</select></div>
        <div><label>Phone</label><input name="customer_phone" type="tel"></div>
        <div><label>City</label><input name="customer_city"></div>
        <div><label>WO number</label><input name="wo_number"></div>
        <div><label>Vehicle (year make model)</label><input name="vehicle"></div>
        <div><label>Odometer</label><input name="odometer" inputmode="numeric"></div>
        <div><label>VIN</label><input name="vin"></div>
        <div><label>License plate</label><input name="plate"></div>
      </div>
      <p><button class="btn">Save work order</button></p></form>`;
    $("#nf").onsubmit = async ev=>{
      ev.preventDefault();
      const o = Object.fromEntries(new FormData(ev.target).entries());
      try{ const n = await api.addOrder(o); showOrder(n.id); }catch(e){ fail(e); }
    };
  };
}

async function showOrder(id){
  $("#app").innerHTML = "Loading…";
  let o; try{ o = await api.order(id); }catch(e){ showList(); return fail(e); }
  const lines = o.job_lines.map(l=>`
    <div class="line" data-s="${h(l.status)}" data-id="${h(l.id)}">
      <div class="line-head">
        <b>${h(l.line_no)}. ${h(l.title)}</b>
        <select class="st" aria-label="Status for ${h(l.title)}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===l.status?"selected":""}>${v}</option>`).join("")}</select>
      </div>
      <label>Notes</label>
      <textarea class="nt" placeholder="What was done, what is left, parts needed">${h(l.notes)}</textarea>
      <div class="meta">${l.updated_at?"Last update "+h(fmt(l.updated_at))+(l.updated_by?" by "+h(l.updated_by):""):"No updates yet"}</div>
      ${timeBox(l)}
      <div class="photos">
        ${l.job_photos.map(p=>`<div class="ph"><img src="${h(p.url)}" alt="Job photo" data-full="${h(p.url)}"><button class="x" data-pid="${h(p.id)}" aria-label="Delete photo">×</button></div>`).join("")}
      </div>
      <div class="line-actions">
        <label class="btn plain small" style="margin:0">Add photo<input class="file" type="file" accept="image/*" capture="environment" multiple hidden></label>
        <button class="btn danger small delline" type="button">Delete task</button>
      </div>
    </div>`).join("");
  $("#app").innerHTML = `
    ${demo?'<div class="banner">Demo mode: sample data only. Nothing here is saved.</div>':''}
    <div id="clockbar"></div>
    <button class="btn plain small back" id="back">All work orders</button>
    <div class="grid2">
      <div class="box"><h2>Customer</h2>
        <div class="kv"><span>Name</span><b>${h(o.customer_name)}</b></div>
        <div class="kv"><span>City</span><span>${h(o.customer_city)}</span></div>
        <div class="kv"><span>Phone</span><span>${h(o.customer_phone)}</span></div>
        <div class="kv"><span>WO number</span><span>${h(o.wo_number)}</span></div></div>
      <div class="box"><h2>Vehicle</h2>
        <div class="kv"><span>Unit</span><b>${h(o.vehicle)}</b></div>
        <div class="kv"><span>Odometer</span><span>${h(o.odometer)}</span></div>
        <div class="kv"><span>VIN</span><span>${h(o.vin)}</span></div>
        <div class="kv"><span>Plate</span><span>${h(o.plate)}</span></div></div>
    </div>
    <div class="box"><h2>Assigned tech</h2>
      <select id="tech" aria-label="Assigned tech">${techOptions(o.tech||"")}</select>
      <div class="meta" style="margin-top:8px;font-size:15px">Total time logged on this work order: <b>${liveSpan(o.job_lines.flatMap(l=>l.time_entries||[]),"",true)}</b></div></div>
    <div class="box"><h2>Work order tasks</h2>
      ${lines || "<p>No tasks yet. Add the first one below.</p>"}
      <form class="addrow" id="al"><input id="nl" placeholder="New task, e.g. Replace awning fabric" required aria-label="New task"><button class="btn">Add task</button></form>
    </div>
    <p><button class="btn danger" id="delwo" type="button">Delete this work order</button></p>`;
  $("#back").onclick = showList;
  view = {name:"order",id:o.id}; refreshClock();
  $("#tech").onchange = async e=>{
    try{ await api.updateOrder(o.id,{tech:e.target.value}); }catch(x){ fail(x); }
  };
  $("#al").onsubmit = async e=>{
    e.preventDefault();
    const next = Math.max(0,...o.job_lines.map(l=>l.line_no)) + 1;
    try{ await api.addLine(o.id,$("#nl").value.trim(),next); showOrder(o.id); }catch(x){ fail(x); }
  };
  $("#delwo").onclick = async ()=>{
    if(!confirm(`Delete the work order for ${o.customer_name}, including all its tasks and photos? This cannot be undone.`)) return;
    try{ await api.delOrder(o.id); showList(); }catch(x){ fail(x); }
  };
  document.querySelectorAll(".line").forEach(el=>{
    const id = el.dataset.id;
    el.querySelector(".st").onchange = async e=>{
      try{ await api.updateLine(id,{status:e.target.value}); showOrder(o.id); }catch(x){ fail(x); }
    };
    const nt = el.querySelector(".nt"); let orig = nt.value;
    nt.onblur = async ()=>{
      if(nt.value===orig) return;
      try{ await api.updateLine(id,{notes:nt.value}); orig = nt.value; el.querySelector(".meta").textContent = "Saved just now"; }catch(x){ fail(x); }
    };
    el.querySelector(".file").onchange = async e=>{
      const files = [...e.target.files]; if(!files.length) return;
      el.querySelector(".meta").textContent = "Uploading " + files.length + " photo" + (files.length>1?"s":"") + "…";
      try{ for(const f of files) await api.addPhoto(id, await shrink(f)); showOrder(o.id); }catch(x){ fail(x); showOrder(o.id); }
    };
    const clk = el.querySelector(".clk");
    clk.onclick = async ()=>{
      try{
        if(clk.dataset.mode==="out"){ await api.clockOut(clk.dataset.eid); }
        else{
          await api.clockIn(id);
          const ln = o.job_lines.find(x=>x.id===id);
          if(ln && ln.status==="not_started") await api.updateLine(id,{status:"in_progress"});
        }
        showOrder(o.id);
      }catch(x){ fail(x); }
    };
    el.querySelectorAll(".editent").forEach(b=>b.onclick = ()=>{
      const tr = b.closest("tr"), eid = tr.dataset.eid;
      tr.innerHTML = `<td colspan="4"><label>Clock in<input type="datetime-local" class="ei" value="${toLocal(tr.dataset.in)}"></label>
        <label>Clock out (leave blank if still working)<input type="datetime-local" class="eo" value="${toLocal(tr.dataset.out)}"></label>
        <div class="line-actions"><button class="btn small saveent" type="button">Save</button><button class="btn danger small delent" type="button">Delete entry</button><button class="btn plain small cancelent" type="button">Cancel</button></div></td>`;
      tr.querySelector(".cancelent").onclick = ()=>showOrder(o.id);
      tr.querySelector(".delent").onclick = async ()=>{
        if(!confirm("Delete this time entry?")) return;
        try{ await api.delEntry(eid); showOrder(o.id); }catch(x){ fail(x); }
      };
      tr.querySelector(".saveent").onclick = async ()=>{
        const i = fromLocal(tr.querySelector(".ei").value), out = fromLocal(tr.querySelector(".eo").value);
        if(!i){ alert("Enter a clock in time."); return; }
        if(out && new Date(out) <= new Date(i)){ alert("Clock out must be after clock in."); return; }
        try{ await api.updateEntry(eid,{clock_in:i,clock_out:out}); showOrder(o.id); }catch(x){ fail(x); }
      };
    });
    el.querySelector(".delline").onclick = async ()=>{
      if(!confirm("Delete this task and its photos? This cannot be undone.")) return;
      try{ await api.delLine(id); showOrder(o.id); }catch(x){ fail(x); }
    };
    el.querySelectorAll(".x").forEach(b=>b.onclick = async ()=>{
      if(!confirm("Delete this photo?")) return;
      const p = o.job_lines.flatMap(l=>l.job_photos).find(p=>p.id===b.dataset.pid);
      try{ await api.delPhoto(p); showOrder(o.id); }catch(x){ fail(x); }
    });
    el.querySelectorAll(".photos img").forEach(im=>im.onclick = ()=>{ $("#lightbox img").src = im.dataset.full; $("#lightbox").classList.remove("hidden"); });
  });
}

$("#lightbox").onclick = ()=>$("#lightbox").classList.add("hidden");
$("#signout").onclick = async ()=>{ if(!demo) await sb.auth.signOut(); showLogin(); };

/* ---------- START ---------- */
(async ()=>{
  const {data} = await sb.auth.getSession();
  if(data.session){ user = data.session.user; api = real; setChrome(); showList(); }
  else showLogin();
})();
</script>
</body>
</html>
