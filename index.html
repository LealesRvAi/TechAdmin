<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Work Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e7eb; --panel:#f4f6f8; --ink:#14202b; --muted:#566573; --line:#b9c2cb;
  --blue:#1f4e79; --blue-ink:#ffffff;
  --s-not:#6b7783; --s-prog:#a85d00; --s-wait:#7a2e8e; --s-done:#1e7a46;
  --danger:#a32020;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;color:var(--ink);background:var(--bg);line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #e08a00;outline-offset:2px}
.bar{background:var(--blue);color:var(--blue-ink);padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;z-index:5}
.bar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.bar .who{font-size:14px;opacity:.85}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.banner{background:#fff3d6;border:1px solid #e0b54d;padding:8px 12px;margin-bottom:12px;border-radius:4px;font-size:15px}
.err{color:var(--danger);margin:8px 0;min-height:1.2em}
/* login */
.login{max-width:380px;margin:12vh auto 0;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.login h1{margin:0 0 4px;font-size:28px}
.login p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff}
textarea{min-height:76px;resize:vertical}
/* list */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}
.wo{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;padding:12px 14px;margin-bottom:8px}
.wo:hover{background:#fff}
.wo b{font-size:19px}
.wo .sub{color:var(--muted);font-size:15px}
.wo .count{float:right;font-size:15px;color:var(--muted)}
/* detail */
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px}
.box h2{margin:0 0 8px;font-size:17px;color:var(--blue);text-decoration:underline;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;gap:8px;margin:2px 0}
.kv span:first-child{color:var(--muted);min-width:82px}
.line{background:#fff;border:1px solid var(--line);border-left:6px solid var(--s-not);border-radius:4px;margin-bottom:10px;padding:12px 14px}
.line[data-s=in_progress]{border-left-color:var(--s-prog)}
.line[data-s=waiting_parts]{border-left-color:var(--s-wait)}
.line[data-s=done]{border-left-color:var(--s-done)}
.line-head{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.line-head b{font-size:19px}
.line select{width:auto;font-weight:600}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photos .ph{position:relative;width:96px;height:96px}
.photos img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
.photos .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:26px;height:26px;line-height:1}
.addrow{display:flex;gap:8px}
.back{margin-bottom:12px}
.hidden{display:none!important}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20}
#lightbox img{max-width:95vw;max-height:92vh}
</style>
</head>
<body>

<div class="bar">
  <h1>Shop Work Orders</h1>
  <div><span class="who" id="who"></span> <button class="btn ghost small hidden" id="signout">Sign out</button></div>
</div>

<div class="wrap" id="app"></div>
<div id="lightbox" class="hidden"><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- CONFIG ---------- */
const SB_URL = "https://emlauoiecckbqriirttn.supabase.co";
const SB_KEY = "sb_publishable_-_iDLW4lEwc0necBCcNeAA_jb_oKPfh";

const STATUS = {not_started:"Not started", in_progress:"In progress", waiting_parts:"Waiting on parts", done:"Done"};
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user = null, demo = false, api = null, current = null;

/* ---------- REAL DATA LAYER (Supabase) ---------- */
const real = {
  async orders(){
    const {data,error} = await sb.from("work_orders").select("*, job_lines(id,status)").order("created_at",{ascending:false});
    if(error) throw error; return data;
  },
  async order(id){
    const {data,error} = await sb.from("work_orders").select("*, job_lines(*, job_photos(*))").eq("id",id).single();
    if(error) throw error;
    data.job_lines.sort((a,b)=>a.line_no-b.line_no);
    const paths = data.job_lines.flatMap(l=>l.job_photos.map(p=>p.path));
    if(paths.length){
      const {data:urls} = await sb.storage.from("job-photos").createSignedUrls(paths,3600);
      const m = {}; (urls||[]).forEach(u=>m[u.path]=u.signedUrl);
      data.job_lines.forEach(l=>l.job_photos.forEach(p=>p.url=m[p.path]));
    }
    return data;
  },
  async addOrder(o){
    const {data,error} = await sb.from("work_orders").insert(o).select().single();
    if(error) throw error; return data;
  },
  async addLine(woId,title,n){
    const {error} = await sb.from("job_lines").insert({work_order_id:woId,title,line_no:n});
    if(error) throw error;
  },
  async updateLine(id,patch){
    const {error} = await sb.from("job_lines").update({...patch,updated_by:user.email,updated_at:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
  },
  async addPhoto(lineId,blob){
    const path = `${lineId}/${Date.now()}.jpg`;
    const up = await sb.storage.from("job-photos").upload(path,blob,{contentType:"image/jpeg"});
    if(up.error) throw up.error;
    const {error} = await sb.from("job_photos").insert({job_line_id:lineId,path,uploaded_by:user.email});
    if(error) throw error;
  },
  async delPhoto(p){
    await sb.storage.from("job-photos").remove([p.path]);
    const {error} = await sb.from("job_photos").delete().eq("id",p.id);
    if(error) throw error;
  }
};

/* ---------- DEMO DATA LAYER (in memory, fake customers, nothing saved) ---------- */
const D = {orders:[
  {id:"d1",wo_number:"10482",customer_name:"Sample, Pat",customer_phone:"555-0100",customer_city:"Anytown, CA",vehicle:"23 Thor Windsport 34J",vin:"1F66F5DN2N0A00000",plate:"9XXX000/CA",odometer:"12254",
   job_lines:[
    {id:"l1",line_no:1,title:"Roof peel n seal",status:"in_progress",notes:"Old sealant removed on front half. Waiting on cure time before second coat.",updated_by:"tech@example.com",updated_at:new Date().toISOString(),job_photos:[]},
    {id:"l2",line_no:2,title:"Replace slide-out seal",status:"not_started",notes:"",updated_by:null,updated_at:null,job_photos:[]}]},
  {id:"d2",wo_number:"10483",customer_name:"Example, Sam",customer_phone:"555-0101",customer_city:"Sample City, CA",vehicle:"19 Winnebago Vista 31K",vin:"",plate:"",odometer:"40812",
   job_lines:[{id:"l3",line_no:1,title:"Water heater won't ignite",status:"waiting_parts",notes:"Ordered igniter board.",updated_by:"tech@example.com",updated_at:new Date().toISOString(),job_photos:[]}]}
]};
const fake = {
  async orders(){return D.orders.map(o=>({...o,job_lines:o.job_lines.map(l=>({id:l.id,status:l.status}))}))},
  async order(id){return D.orders.find(o=>o.id===id)},
  async addOrder(o){const n={...o,id:"d"+Date.now(),job_lines:[]};D.orders.unshift(n);return n},
  async addLine(woId,title,n){D.orders.find(o=>o.id===woId).job_lines.push({id:"l"+Date.now(),line_no:n,title,status:"not_started",notes:"",job_photos:[]})},
  async updateLine(id,patch){D.orders.forEach(o=>o.job_lines.forEach(l=>{if(l.id===id)Object.assign(l,patch,{updated_by:"demo",updated_at:new Date().toISOString()})}))},
  async addPhoto(lineId,blob){D.orders.forEach(o=>o.job_lines.forEach(l=>{if(l.id===lineId)l.job_photos.push({id:"p"+Date.now(),url:URL.createObjectURL(blob)})}))},
  async delPhoto(p){D.orders.forEach(o=>o.job_lines.forEach(l=>{l.job_photos=l.job_photos.filter(x=>x.id!==p.id)}))}
};

/* ---------- HELPERS ---------- */
function shrink(file, max=1600, q=0.72){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Could not process photo")),"image/jpeg",q);
    };
    img.onerror = ()=>rej(new Error("Could not read that photo"));
    img.src = url;
  });
}
const fmt = t => t ? new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
function setChrome(){
  $("#who").textContent = demo ? "Demo mode" : (user ? user.email : "");
  $("#signout").classList.toggle("hidden", !user && !demo);
}
function fail(e){ alert("Something went wrong: " + (e.message || e)); }

/* ---------- VIEWS ---------- */
function showLogin(){
  demo = false; user = null; setChrome();
  $("#app").innerHTML = `
  <form class="login" id="lf">
    <h1>Sign in</h1><p>Use the account the shop gave you.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert"></div>
    <button class="btn" style="width:100%">Sign in</button>
    <p style="margin:16px 0 0;text-align:center"><button type="button" class="btn plain small" id="dm">Look around in demo mode</button></p>
  </form>`;
  $("#lf").onsubmit = async e=>{
    e.preventDefault(); $("#le").textContent="";
    const {data,error} = await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){ $("#le").textContent = "Wrong email or password."; return; }
    user = data.user; api = real; setChrome(); showList();
  };
  $("#dm").onclick = ()=>{ demo = true; api = fake; setChrome(); showList(); };
}

async function showList(){
  current = null;
  $("#app").innerHTML = `
    ${demo?'<div class="banner">Demo mode: sample data only. Nothing here is saved.</div>':''}
    <div class="toolbar"><input id="q" type="search" placeholder="Search customer, vehicle, or WO #" aria-label="Search work orders"><button class="btn" id="new">New work order</button></div>
    <div id="newform" class="hidden"></div>
    <div id="list">Loading…</div>`;
  let rows = [];
  try{ rows = await api.orders(); }catch(e){ $("#list").textContent=""; return fail(e); }
  const draw = ()=>{
    const q = $("#q").value.toLowerCase();
    const f = rows.filter(o=>[o.wo_number,o.customer_name,o.vehicle].join(" ").toLowerCase().includes(q));
    $("#list").innerHTML = f.length ? f.map(o=>{
      const total = o.job_lines.length, done = o.job_lines.filter(l=>l.status==="done").length;
      return `<button class="wo" data-id="${h(o.id)}"><span class="count">${done} of ${total} done</span><b>${h(o.customer_name)}</b><div class="sub">${h(o.vehicle||"No vehicle listed")}${o.wo_number?" · WO "+h(o.wo_number):""}</div></button>`;
    }).join("") : `<p>No work orders yet. Use New work order to add one.</p>`;
  };
  draw();
  $("#q").oninput = draw;
  $("#list").onclick = e=>{ const b=e.target.closest(".wo"); if(b) showOrder(b.dataset.id); };
  $("#new").onclick = ()=>{
    const f = $("#newform"); f.classList.toggle("hidden");
    if(f.classList.contains("hidden")) return;
    f.innerHTML = `<form class="box" id="nf"><h2>New work order</h2>
      <div class="grid2">
        <div><label>Customer name</label><input name="customer_name" required></div>
        <div><label>Phone</label><input name="customer_phone" type="tel"></div>
        <div><label>City</label><input name="customer_city"></div>
        <div><label>WO number</label><input name="wo_number"></div>
        <div><label>Vehicle (year make model)</label><input name="vehicle"></div>
        <div><label>Odometer</label><input name="odometer" inputmode="numeric"></div>
        <div><label>VIN</label><input name="vin"></div>
        <div><label>License plate</label><input name="plate"></div>
      </div>
      <p><button class="btn">Save work order</button></p></form>`;
    $("#nf").onsubmit = async ev=>{
      ev.preventDefault();
      const o = Object.fromEntries(new FormData(ev.target).entries());
      try{ const n = await api.addOrder(o); showOrder(n.id); }catch(e){ fail(e); }
    };
  };
}

async function showOrder(id){
  $("#app").innerHTML = "Loading…";
  let o; try{ o = await api.order(id); }catch(e){ showList(); return fail(e); }
  current = id;
  const lines = o.job_lines.map(l=>`
    <div class="line" data-s="${h(l.status)}" data-id="${h(l.id)}">
      <div class="line-head">
        <b>${h(l.line_no)}. ${h(l.title)}</b>
        <select class="st" aria-label="Status for ${h(l.title)}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===l.status?"selected":""}>${v}</option>`).join("")}</select>
      </div>
      <label>Notes</label>
      <textarea class="nt" placeholder="What was done, what is left, parts needed">${h(l.notes)}</textarea>
      <div class="meta">${l.updated_at?"Last update "+h(fmt(l.updated_at))+(l.updated_by?" by "+h(l.updated_by):""):"No updates yet"}</div>
      <div class="photos">
        ${l.job_photos.map(p=>`<div class="ph"><img src="${h(p.url)}" alt="Job photo" data-full="${h(p.url)}"><button class="x" data-pid="${h(p.id)}" aria-label="Delete photo">×</button></div>`).join("")}
      </div>
      <p style="margin:10px 0 0"><label class="btn plain small" style="display:inline-block;margin:0">Add photo<input class="file" type="file" accept="image/*" capture="environment" multiple hidden></label></p>
    </div>`).join("");
  $("#app").innerHTML = `
    ${demo?'<div class="banner">Demo mode: sample data only. Nothing here is saved.</div>':''}
    <button class="btn plain small back" id="back">All work orders</button>
    <div class="grid2">
      <div class="box"><h2>Customer</h2>
        <div class="kv"><span>Name</span><b>${h(o.customer_name)}</b></div>
        <div class="kv"><span>City</span><span>${h(o.customer_city)}</span></div>
        <div class="kv"><span>Phone</span><span>${h(o.customer_phone)}</span></div>
        <div class="kv"><span>WO number</span><span>${h(o.wo_number)}</span></div></div>
      <div class="box"><h2>Vehicle</h2>
        <div class="kv"><span>Unit</span><b>${h(o.vehicle)}</b></div>
        <div class="kv"><span>Odometer</span><span>${h(o.odometer)}</span></div>
        <div class="kv"><span>VIN</span><span>${h(o.vin)}</span></div>
        <div class="kv"><span>Plate</span><span>${h(o.plate)}</span></div></div>
    </div>
    <div class="box"><h2>Work order tasks</h2>
      ${lines || "<p>No tasks yet. Add the first one below.</p>"}
      <form class="addrow" id="al"><input id="nl" placeholder="New task, e.g. Replace awning fabric" required aria-label="New task"><button class="btn">Add task</button></form>
    </div>`;
  $("#back").onclick = showList;
  $("#al").onsubmit = async e=>{
    e.preventDefault();
    try{ await api.addLine(o.id,$("#nl").value.trim(),o.job_lines.length+1); showOrder(o.id); }catch(x){ fail(x); }
  };
  document.querySelectorAll(".line").forEach(el=>{
    const id = el.dataset.id;
    el.querySelector(".st").onchange = async e=>{
      try{ await api.updateLine(id,{status:e.target.value}); showOrder(o.id); }catch(x){ fail(x); }
    };
    const nt = el.querySelector(".nt"); let orig = nt.value;
    nt.onblur = async ()=>{
      if(nt.value===orig) return;
      try{ await api.updateLine(id,{notes:nt.value}); orig = nt.value; el.querySelector(".meta").textContent = "Saved just now"; }catch(x){ fail(x); }
    };
    el.querySelector(".file").onchange = async e=>{
      const files = [...e.target.files]; if(!files.length) return;
      el.querySelector(".meta").textContent = "Uploading " + files.length + " photo" + (files.length>1?"s":"") + "…";
      try{ for(const f of files) await api.addPhoto(id, await shrink(f)); showOrder(o.id); }catch(x){ fail(x); showOrder(o.id); }
    };
    el.querySelectorAll(".x").forEach(b=>b.onclick = async ()=>{
      if(!confirm("Delete this photo?")) return;
      const p = o.job_lines.flatMap(l=>l.job_photos).find(p=>p.id===b.dataset.pid);
      try{ await api.delPhoto(p); showOrder(o.id); }catch(x){ fail(x); }
    });
    el.querySelectorAll(".photos img").forEach(im=>im.onclick = ()=>{ $("#lightbox img").src = im.dataset.full; $("#lightbox").classList.remove("hidden"); });
  });
}

$("#lightbox").onclick = ()=>$("#lightbox").classList.add("hidden");
$("#signout").onclick = async ()=>{ if(!demo) await sb.auth.signOut(); showLogin(); };

/* ---------- START ---------- */
(async ()=>{
  const {data} = await sb.auth.getSession();
  if(data.session){ user = data.session.user; api = real; setChrome(); showList(); }
  else showLogin();
})();
</script>
</body>
</html>
